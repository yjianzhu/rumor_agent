{% extends "public_base.html" %}

{% block title %}谣言库 · 辟谣{% endblock %}

{% block content %}
<section class="border-b border-stone-200/80">
  <div class="max-w-6xl mx-auto px-5 sm:px-8 pt-16 pb-12">
    <h1 class="font-serif text-4xl sm:text-5xl font-bold tracking-tight text-ink">
      谣言库
    </h1>
    <p class="mt-3 text-stone-500 max-w-xl leading-relaxed">
      汇集网络上流传的争议性信息，由人工核查后给出真伪结论。共收录 <span class="text-ink font-medium">{{ total }}</span> 条已核查词条。
    </p>

    <form class="mt-8 flex flex-wrap items-center gap-2" onsubmit="return false;">
      <div class="relative flex-1 min-w-[240px]">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-400" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <input
          type="search"
          name="q"
          placeholder="搜索词条 / 关键词..."
          value="{{ q or '' }}"
          class="w-full rounded-full bg-white border border-stone-200 pl-10 pr-4 py-2.5 text-sm placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all"
          hx-get="/partials/rumors"
          hx-trigger="input changed delay:300ms, search"
          hx-target="#rumor-list"
          hx-include="[name='status'],[name='tag']"
          hx-indicator="#loading"
        >
      </div>

      <select
        name="status"
        class="rounded-full bg-white border border-stone-200 px-4 py-2.5 text-sm appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all"
        hx-get="/partials/rumors"
        hx-trigger="change"
        hx-target="#rumor-list"
        hx-include="[name='q'],[name='tag']"
      >
        <option value="">全部结论</option>
        <option value="FAKE" {% if status == 'FAKE' %}selected{% endif %}>虚假</option>
        <option value="TRUE" {% if status == 'TRUE' %}selected{% endif %}>属实</option>
        <option value="OUTDATED" {% if status == 'OUTDATED' %}selected{% endif %}>已过时</option>
      </select>

      {% if tags %}
      <select
        name="tag"
        class="rounded-full bg-white border border-stone-200 px-4 py-2.5 text-sm appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-ink/10 focus:border-stone-400 transition-all"
        hx-get="/partials/rumors"
        hx-trigger="change"
        hx-target="#rumor-list"
        hx-include="[name='q'],[name='status']"
      >
        <option value="">全部标签</option>
        {% for t in tags %}
        <option value="{{ t }}" {% if tag == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
      {% endif %}

      <span id="loading" class="htmx-indicator items-center gap-1.5 text-xs text-stone-400 ml-1">
        <svg class="animate-spin h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        加载中
      </span>
    </form>
  </div>
</section>

<section class="max-w-6xl mx-auto px-5 sm:px-8 py-10">
  <div id="rumor-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
    {% include "public/partials/rumor_list.html" %}
  </div>
</section>
{% endblock %}
