{% for rumor in rumors %}
  {% include "public/partials/rumor_card.html" %}
{% else %}
<div class="col-span-full text-center py-24">
  <svg class="mx-auto h-12 w-12 text-stone-300 mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1.4" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/>
  </svg>
  <p class="text-stone-500">暂无符合条件的词条</p>
  <p class="text-xs text-stone-400 mt-1">尝试调整搜索或筛选条件</p>
</div>
{% endfor %}

{% if has_more %}
<button
  class="col-span-full mx-auto mt-4 inline-flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-stone-600 bg-white border border-stone-200 rounded-full hover:border-stone-300 hover:text-ink transition-all"
  hx-get="/partials/rumors?offset={{ next_offset }}&limit={{ limit }}{% if q %}&q={{ q }}{% endif %}{% if status %}&status={{ status }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}"
  hx-target="this"
  hx-swap="outerHTML"
>
  加载更多
  <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
  </svg>
</button>
{% endif %}
