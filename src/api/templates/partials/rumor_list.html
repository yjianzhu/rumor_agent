<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
  {% for rumor in rumors %}
    {% include "partials/rumor_card.html" %}
  {% else %}
    <div class="col-span-full text-center py-16 text-gray-400">
      <p class="text-lg">暂无数据</p>
      <p class="text-sm mt-1">尝试调整筛选条件或导入数据</p>
    </div>
  {% endfor %}
</div>

{% if has_more %}
<div class="text-center">
  <button
    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
    hx-get="/partials/rumors?offset={{ next_offset }}&limit={{ limit }}{% if q %}&q={{ q }}{% endif %}{% if status %}&status={{ status }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}"
    hx-target="#rumor-list"
    hx-swap="outerHTML"
    hx-select="#rumor-list"
  >
    加载更多
  </button>
</div>
{% endif %}
