<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mb-4">
  {% for rumor in rumors %}
    {% include "partials/rumor_card.html" %}
  {% else %}
    <div class="col-span-full text-center py-20 text-slate-400">
      <svg class="mx-auto h-12 w-12 text-slate-300 mb-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Zm3.75 11.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
      </svg>
      <p class="text-lg font-medium text-slate-500">暂无数据</p>
      <p class="text-sm mt-1">尝试调整筛选条件或导入数据</p>
    </div>
  {% endfor %}
</div>

{% if has_more %}
<div class="text-center">
  <button
    class="px-6 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-full shadow-sm hover:shadow hover:bg-slate-50 transition-all duration-150"
    hx-get="/partials/rumors?offset={{ next_offset }}&limit={{ limit }}{% if q %}&q={{ q }}{% endif %}{% if status %}&status={{ status }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}"
    hx-target="#rumor-list"
    hx-swap="outerHTML"
    hx-select="#rumor-list"
  >
    加载更多
  </button>
</div>
{% endif %}
