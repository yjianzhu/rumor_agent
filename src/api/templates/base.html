<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rumor Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    [htmx-indicator] { display: none; }
    .htmx-request [htmx-indicator] { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .htmx-added { animation: fadeSlideIn 0.2s ease-out; }
    .htmx-settling { transition: opacity 0.15s ease-out; }

    /* markdown 渲染区域 — 配合 deps.render_markdown */
    .markdown-body { color: inherit; line-height: 1.75; }
    .markdown-body > * + * { margin-top: 0.75em; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      font-weight: 600; line-height: 1.3; color: #1e293b; margin-top: 1.3em;
    }
    .markdown-body h1 { font-size: 1.3em; }
    .markdown-body h2 { font-size: 1.15em; }
    .markdown-body h3 { font-size: 1.02em; }
    .markdown-body p { margin: 0; }
    .markdown-body strong { color: #1e293b; font-weight: 600; }
    .markdown-body em { font-style: italic; }
    .markdown-body a { color: #4f46e5; text-decoration: underline; text-underline-offset: 2px; }
    .markdown-body a:hover { color: #6366f1; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.3em; }
    .markdown-body ul { list-style: disc; }
    .markdown-body ol { list-style: decimal; }
    .markdown-body li + li { margin-top: 0.25em; }
    .markdown-body blockquote {
      border-left: 3px solid #cbd5e1; padding: 0.1em 0.8em; color: #475569;
      background: rgba(248, 250, 252, 0.6); border-radius: 0 0.4em 0.4em 0;
    }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em; background: #f1f5f9; padding: 0.13em 0.38em;
      border-radius: 0.3em; color: #334155;
    }
    .markdown-body pre {
      background: #0f172a; color: #f8fafc; padding: 0.85em 1em;
      border-radius: 0.6em; overflow-x: auto; font-size: 0.85em; line-height: 1.55;
    }
    .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
    .markdown-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.4em 0; }
    .markdown-body table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
    .markdown-body th, .markdown-body td {
      border: 1px solid #e2e8f0; padding: 0.45em 0.65em; text-align: left;
    }
    .markdown-body th { background: #f8fafc; font-weight: 600; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
  <!-- Nav -->
  <nav class="sticky top-0 z-30 bg-white/80 backdrop-blur-lg border-b border-slate-200/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/admin" class="text-lg font-semibold tracking-tight text-slate-800 hover:text-slate-600 transition-colors duration-150">Rumor Agent · Admin</a>
        <div class="flex items-center gap-4">
          <a href="/" class="text-xs text-slate-400 hover:text-slate-600 transition-colors duration-150">公开站</a>
          <a href="/docs" target="_blank" class="text-xs text-slate-400 hover:text-slate-600 transition-colors duration-150">API Docs</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
