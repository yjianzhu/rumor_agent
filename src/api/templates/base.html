<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rumor Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    [htmx-indicator] { display: none; }
    .htmx-request [htmx-indicator] { display: inline-block; }
    .htmx-request.htmx-indicator { display: inline-block; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .htmx-added { animation: fadeSlideIn 0.2s ease-out; }
    .htmx-settling { transition: opacity 0.15s ease-out; }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">
  <!-- Nav -->
  <nav class="sticky top-0 z-30 bg-white/80 backdrop-blur-lg border-b border-slate-200/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/" class="text-lg font-semibold tracking-tight text-slate-800 hover:text-slate-600 transition-colors duration-150">Rumor Agent</a>
        <a href="/docs" target="_blank" class="text-xs text-slate-400 hover:text-slate-600 transition-colors duration-150">API Docs</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
