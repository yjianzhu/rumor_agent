{% extends "base.html" %}

{% block title %}Rumor Agent — 谣言浏览{% endblock %}

{% block content %}
<!-- Toolbar -->
<div class="flex flex-wrap items-center gap-3 mb-5">
  <input
    type="search"
    name="q"
    placeholder="搜索标题 / 内容..."
    value="{{ q or '' }}"
    class="flex-1 min-w-[200px] rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
    hx-get="/partials/rumors"
    hx-trigger="input changed delay:300ms, search"
    hx-target="#rumor-list"
    hx-include="[name='status'],[name='tag']"
    hx-indicator="#loading"
  >

  <select
    name="status"
    class="rounded-md border border-gray-300 px-3 py-2 text-sm bg-white"
    hx-get="/partials/rumors"
    hx-trigger="change"
    hx-target="#rumor-list"
    hx-include="[name='q'],[name='tag']"
  >
    <option value="">全部状态</option>
    <option value="FAKE" {% if status == 'FAKE' %}selected{% endif %}>FAKE</option>
    <option value="TRUE" {% if status == 'TRUE' %}selected{% endif %}>TRUE</option>
    <option value="DUBIOUS" {% if status == 'DUBIOUS' %}selected{% endif %}>DUBIOUS</option>
    <option value="OUTDATED" {% if status == 'OUTDATED' %}selected{% endif %}>OUTDATED</option>
  </select>

  <select
    name="tag"
    class="rounded-md border border-gray-300 px-3 py-2 text-sm bg-white"
    hx-get="/partials/rumors"
    hx-trigger="change"
    hx-target="#rumor-list"
    hx-include="[name='q'],[name='status']"
  >
    <option value="">全部标签</option>
    {% for t in tags %}
    <option value="{{ t }}" {% if tag == t %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>

  <span id="loading" class="htmx-indicator text-sm text-gray-400">加载中...</span>
</div>

<!-- Stats bar -->
<div id="stats-bar" hx-get="/partials/stats" hx-trigger="load" hx-swap="innerHTML">
  {% include "partials/stats_bar.html" %}
</div>

<!-- Rumor list -->
<div id="rumor-list">
  {% include "partials/rumor_list.html" %}
</div>
{% endblock %}
